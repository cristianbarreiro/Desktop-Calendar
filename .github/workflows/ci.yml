name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CalendarWidget.slnx

    - name: Build solution
      run: dotnet build CalendarWidget.slnx --no-restore -c Release

    - name: Run automated tests
      run: dotnet test CalendarWidget.slnx --no-build -c Release --verbosity normal

    - name: Verify code formatting
      run: dotnet format CalendarWidget.slnx --verify-no-changes
