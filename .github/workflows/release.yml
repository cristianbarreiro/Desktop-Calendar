name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CalendarWidget.slnx

    - name: Build solution (Release)
      run: dotnet build CalendarWidget.slnx --no-restore -c Release

    - name: Run automated tests
      run: dotnet test CalendarWidget.slnx --no-build -c Release --verbosity normal

    - name: Verify code formatting
      run: dotnet format CalendarWidget.slnx --verify-no-changes

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Package distributions and installer
      shell: pwsh
      run: |
        ./scripts/package.ps1 -SkipTests -SkipFormatCheck

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: artifacts/release/
        if-no-files-found: error

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/release/*.zip
          artifacts/release/*.exe
          artifacts/release/SHA256SUMS.txt
        generate_release_notes: true
